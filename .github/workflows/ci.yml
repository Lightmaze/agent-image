name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run python scripts/scan_mock_points.py --root . --fail-on-issues
      - run: uv run python scripts/scan_mojibake.py .
      - run: uv run agent-image registry validate registry/v0.1/index.json --json
      - run: uv build --cache-dir .tmp/uv-cache

  installed-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --cache-dir .tmp/uv-cache
      - run: uv build --cache-dir .tmp/uv-cache
      - shell: pwsh
        run: ./scripts/installed-package-smoke.ps1

  real-hermes-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: fcbd1076a93841fa88855acce810e342a5b78101
          path: .tmp/hermes-src
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --isolated --with-editable .tmp/hermes-src python scripts/hermes_ci_smoke.py
