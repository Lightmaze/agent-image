name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run python scripts/scan_mock_points.py --root . --fail-on-issues
      - run: uv run python scripts/scan_mojibake.py .
      - run: uv run agent-image registry validate registry/v0.1/index.json --json
      - run: uv build --cache-dir .tmp/uv-cache

  installed-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          # Match the explicit cache path in the commands and smoke script.
          cache-local-path: .tmp/uv-cache
      - run: uv sync --locked --cache-dir .tmp/uv-cache
      - run: uv build --cache-dir .tmp/uv-cache
      - shell: pwsh
        run: ./scripts/installed-package-smoke.ps1

  real-hermes-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: fcbd1076a93841fa88855acce810e342a5b78101
          path: .tmp/hermes-src
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --isolated --with-editable .tmp/hermes-src python scripts/hermes_ci_smoke.py

  real-hermes-continuation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: fcbd1076a93841fa88855acce810e342a5b78101
          path: .tmp/hermes-src
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --isolated --with-editable .tmp/hermes-src python scripts/hermes_continuation_ci.py

  real-openclaw-continuation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - shell: pwsh
        run: |
          npm install --global npm@11.12.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((npm --version).Trim() -ne "11.12.1") { throw "Unexpected npm version" }
          npm install --prefix .tmp/openclaw-runtime openclaw@2026.7.1-2 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $openclaw = Join-Path $PWD ".tmp\openclaw-runtime\node_modules\.bin\openclaw.cmd"
          $node = (Get-Command node).Source
          uv run python scripts/openclaw_continuation_ci.py --openclaw-binary $openclaw --node-binary $node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  real-dsh-noop-refreeze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - shell: pwsh
        run: |
          npm install --global npm@11.12.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((npm --version).Trim() -ne "11.12.1") { throw "Unexpected npm version" }
          npm install --prefix .tmp/dsh-runtime @deepseek-ai/dsh@0.1.0-rc.6 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dsh = Join-Path $PWD ".tmp\dsh-runtime\node_modules\@deepseek-ai\dsh\lib\bin.js"
          $node = (Get-Command node).Source
          uv run python scripts/dsh_noop_refreeze_ci.py --dsh-bin-js $dsh --node-binary $node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
