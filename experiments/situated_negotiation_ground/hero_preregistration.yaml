experiment: agent-image-public-hero-comparison-v0.1
status: frozen_before_provider_calls
frozen_at: 2026-08-26T00:00:00Z
purpose: >-
  Determine whether the fixed public procurement-negotiator Agent Image retains
  mission-specific capability after a fresh Hermes restore by comparing it with
  a same-model fresh Agent. This is supporting release evidence, not an operator
  workflow.
pre_call_amendment:
  status: frozen_before_any_provider_call
  reason: >-
    The initially planned live private-trained arm was removed because permission
    to use provider credits does not authorize sending private native Agent state
    to that provider. The already-published Gate E result remains lineage evidence
    and is not mixed numerically with this comparison.
  changed:
    arms: three_to_two
    total_model_invocations: 72_to_48
    thresholds: removed_live_private_parent_comparisons
  scientific_effect: >-
    The experiment tests public-restored versus fresh capability on new held-out
    scenarios. It does not estimate a concurrent public-to-private retention ratio.
